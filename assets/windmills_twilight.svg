<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Cinematic Twilight Sunset Sky Gradient -->
    <linearGradient id="twilightSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#182438" />
      <stop offset="28%" stop-color="#2a3952" />
      <stop offset="52%" stop-color="#464b63" />
      <stop offset="72%" stop-color="#7a5563" />
      <stop offset="84%" stop-color="#b86b52" />
      <stop offset="93%" stop-color="#d98246" />
      <stop offset="100%" stop-color="#694030" />
    </linearGradient>

    <!-- Cloud Gradients -->
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3952" stop-opacity="0" />
      <stop offset="30%" stop-color="#3d4961" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#4e516b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2a3952" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cloudGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c4785a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4e516b" stop-opacity="0" />
    </linearGradient>

    <!-- Turbine Tower Lighting Gradients -->
    <linearGradient id="towerGradMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="bladeGradLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="bladeGradShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Road Perspective Gradient -->
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#262c38" />
      <stop offset="40%" stop-color="#191e26" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>

    <!-- Scrim Gradient for Ultra-Legible Crisp Text -->
    <linearGradient id="bottomScrim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#05070a" stop-opacity="0" />
      <stop offset="40%" stop-color="#05070a" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#05070a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.94" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="800" height="800" fill="url(#twilightSky)" />

  <!-- Atmospheric Clouds -->
  <ellipse cx="480" cy="220" rx="380" ry="45" fill="url(#cloudGrad1)" />
  <ellipse cx="300" cy="310" rx="340" ry="55" fill="url(#cloudGrad1)" />
  <ellipse cx="420" cy="460" rx="360" ry="38" fill="url(#cloudGrad2)" />
  <ellipse cx="220" cy="510" rx="280" ry="30" fill="url(#cloudGrad2)" />

  <!-- Distant Mountain/Terrain Silhouettes -->
  <path d="M0,640 Q180,610 380,630 T800,620 L800,800 L0,800 Z" fill="#241e28" opacity="0.85" />
  <path d="M0,660 Q260,635 520,650 T800,645 L800,800 L0,800 Z" fill="#18171f" />

  <!-- Asphalt Road Cutting Through Landscape -->
  <polygon points="410,645 445,645 740,800 240,800" fill="url(#roadGrad)" />
  <!-- Road Edge Lines -->
  <line x1="412" y1="645" x2="245" y2="800" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <line x1="443" y1="645" x2="735" y2="800" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <!-- Road Center Dashed Line with Perspective -->
  <line x1="428" y1="648" x2="490" y2="800" stroke="#fef08a" stroke-width="4.5" stroke-dasharray="24,20" opacity="0.55" />

  <!-- ==================== BACKGROUND TURBINE (RIGHT DISTANT) ==================== -->
  <g opacity="0.65">
    <!-- Tower -->
    <polygon points="598,635 602,635 600.8,420 599.2,420" fill="#64748b" />
    <circle cx="600" cy="420" r="3.5" fill="#94a3b8" />
    <!-- Beacon -->
    <circle cx="600" cy="417" r="1.5" fill="#ef4444" opacity="0.9" />
    <!-- Blades -->
    <polygon points="600,420 599,320 601,320" fill="#94a3b8" />
    <polygon points="600,420 515,465 516,467" fill="#64748b" />
    <polygon points="600,420 685,465 684,467" fill="#475569" />
  </g>

  <!-- ==================== MIDGROUND TURBINE (LEFT) ==================== -->
  <g opacity="0.85">
    <!-- Tower -->
    <polygon points="266,645 274,645 271.5,310 268.5,310" fill="url(#towerGradMain)" />
    <!-- Nacelle & Hub -->
    <rect x="264" y="306" width="14" height="7" rx="3" fill="#64748b" />
    <circle cx="270" cy="310" r="6" fill="#cbd5e1" />
    <!-- Aviation warning light -->
    <circle cx="270" cy="304" r="2" fill="#ef4444" />
    <!-- Rotor Blades -->
    <path d="M270,310 L268,170 Q270,165 272,170 L271,310 Z" fill="url(#bladeGradLit)" />
    <path d="M270,310 L150,380 Q145,382 148,385 L270,312 Z" fill="url(#bladeGradLit)" />
    <path d="M270,310 L390,380 Q395,382 392,385 L270,308 Z" fill="url(#bladeGradShadow)" />
  </g>

  <!-- ==================== FOREGROUND MAIN TURBINE (TALL CENTER-RIGHT) ==================== -->
  <g>
    <!-- Tower Foundation Shadow -->
    <ellipse cx="430" cy="650" rx="14" ry="4" fill="#0f172a" opacity="0.8" />
    <!-- Tower Cylinder with Specular Light -->
    <polygon points="423,650 437,650 432.5,190 427.5,190" fill="url(#towerGradMain)" />
    
    <!-- Nacelle Box (Turbine Generator Housing) -->
    <rect x="420" y="184" width="22" height="11" rx="4" fill="#64748b" />
    <!-- Hub Spinner Dome -->
    <circle cx="430" cy="190" r="9" fill="#e2e8f0" />
    <circle cx="430" cy="190" r="4.5" fill="#94a3b8" />
    <!-- Aircraft Obstruction Warning Red Beacon -->
    <circle cx="430" cy="182" r="2.8" fill="#ef4444" />
    <circle cx="430" cy="182" r="5" fill="#ef4444" opacity="0.35" />

    <!-- 3 Aerodynamic Rotor Blades (High Resolution Vectors) -->
    <!-- Blade 1: Pointing Upward into Sky -->
    <path d="M430,190 C428,150 426,80 427,30 C429,22 432,22 433,30 C434,80 432,150 430,190 Z" fill="url(#bladeGradLit)" />
    <line x1="430" y1="35" x2="430" y2="185" stroke="#f1f5f9" stroke-width="1.2" opacity="0.7" />

    <!-- Blade 2: Angled Down-Left -->
    <path d="M430,190 C395,215 310,270 265,302 C258,307 259,311 267,311 C315,302 398,235 430,190 Z" fill="url(#bladeGradLit)" />
    <line x1="270" y1="305" x2="425" y2="195" stroke="#f1f5f9" stroke-width="1.2" opacity="0.7" />

    <!-- Blade 3: Angled Down-Right -->
    <path d="M430,190 C465,215 550,270 595,302 C602,307 601,311 593,311 C545,302 462,235 430,190 Z" fill="url(#bladeGradShadow)" />
    <line x1="590" y1="305" x2="435" y2="195" stroke="#cbd5e1" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Twilight Star Sparkle in Upper Left -->
  <g transform="translate(180, 80) scale(0.8)" fill="#fef08a" opacity="0.85">
    <path d="M0,-12 L2.5,-3 L11,0 L2.5,3 L0,12 L-2.5,3 L-11,0 L-2.5,-3 Z" />
  </g>
  <g transform="translate(680, 110) scale(0.6)" fill="#fef08a" opacity="0.7">
    <path d="M0,-12 L2.5,-3 L11,0 L2.5,3 L0,12 L-2.5,3 L-11,0 L-2.5,-3 Z" />
  </g>

  <!-- Bottom Vignette / Scrim to give 100% Crisp Legibility to Text -->
  <rect y="380" width="800" height="420" fill="url(#bottomScrim)" />
</svg>
